[project]
name = "janulon"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "playwright>=1.40",
    "transformers>=4.45.0",
    "django>=5.0",
    "django-htmx>=1.21",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "python-semantic-release>=10.5.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = true

[tool.pytest.ini_options]
markers = [
    "integration: slow tests that load real models or need network access",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "retina*"]
