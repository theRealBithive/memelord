services:
  memelord:
    build: .
    image: memelord:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file: .env
    command: web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/login/\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qcluster:
    image: memelord:latest
    volumes:
      - ./data:/data
    env_file: .env
    command: qcluster
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      memelord:
        condition: service_healthy
