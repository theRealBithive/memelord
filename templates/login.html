{% extends "base.html" %}
{% block title %}login{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
  <div class="login-wrap">
    <form class="login-form" method="post">
      {% csrf_token %}
      <p class="login-title">memelord</p>
      {% if form.errors %}
        <p class="login-error">Invalid credentials.</p>
      {% endif %}
      <input class="field" type="text" name="username" placeholder="Username" autofocus required autocomplete="username">
      <input class="field" type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>
{% endblock %}
