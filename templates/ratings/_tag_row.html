<tr id="tag-row-{{ tag.pk }}">
  <td class="tag-cell-name">
    <a href="{% url 'gallery' %}?tag={{ tag.name }}" class="tag-name-link">#{{ tag.name }}</a>
  </td>
  <td class="tag-cell-count">{{ tag.n }}</td>
  <td class="tag-cell-actions">
    <button class="tag-btn tag-btn-edit"
            hx-get="{% url 'tag_rename' tag.pk %}?edit=1"
            hx-target="#tag-row-{{ tag.pk }}"
            hx-swap="outerHTML">rename</button>
    <button class="tag-btn tag-btn-delete"
            hx-post="{% url 'tag_delete' tag.pk %}"
            hx-target="#tag-row-{{ tag.pk }}"
            hx-swap="outerHTML"
            {% if tag.n > 0 %}hx-confirm="Remove tag #{{ tag.name }} from {{ tag.n }} image{{ tag.n|pluralize }}?"{% endif %}>delete</button>
  </td>
</tr>
