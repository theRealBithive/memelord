<div id="source-list">
{% if imported is not None %}
<p class="import-notice">Imported {{ imported }} new source{{ imported|pluralize }} from config.toml.</p>
{% endif %}
{% for source in sources %}
  {% include "ratings/_source_row.html" %}
{% empty %}
  <p class="empty-hint">No sources yet. Add one below or import from config.toml.</p>
{% endfor %}
</div>
