{% if share_channels %}
{% if share_channels|length == 1 %}
<form class="share-form"
      hx-post="{% url 'share_image' image.content_hash %}"
      hx-target="#share-toast"
      hx-swap="outerHTML">
  {% csrf_token %}
  <input type="hidden" name="channels" value="{{ share_channels.0.pk }}">
  <button type="submit" class="share-btn" title="Share to {{ share_channels.0.name }}">↗</button>
</form>
{% else %}
<button type="button"
        class="share-btn share-btn--picker"
        data-share-url="{% url 'share_image' image.content_hash %}"
        title="Share…">↗</button>
{% endif %}
<span id="share-toast"></span>
{% endif %}
