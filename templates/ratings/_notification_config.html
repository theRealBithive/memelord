{% include "ratings/_channel_list.html" %}

<div style="margin-top:1rem">
  <div class="section-title" style="margin-bottom:0.6rem">Add channel</div>
  <form class="add-form"
        hx-post="{% url 'channel_add' %}"
        hx-target="#channel-list"
        hx-swap="outerHTML"
        hx-on::after-request="this.querySelector('input[name=name]').value=''">
    {% csrf_token %}
    <select name="service">
      <option value="mattermost">Mattermost</option>
      <option value="signal">Signal</option>
    </select>
    <input type="text" name="name" placeholder="Channel name (e.g. Aurea)" required autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <div id="channel-add-error"></div>
</div>
