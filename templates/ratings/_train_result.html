<div id="train-result" class="train-result {% if ok %}train-ok{% else %}train-err{% endif %}">
{% if ok %}
  <span class="train-icon">✓</span>
  <span>Trained on {{ positive_n }} positive (score ≥ 3) and {{ negative_n }} negative (score ≤ 2) images. Weights saved.</span>
{% else %}
  <span class="train-icon">✕</span>
  <span>{{ error }}</span>
{% endif %}
</div>
