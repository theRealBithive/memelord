{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>memelord — corpus review</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  {% include "ratings/_nav.html" %}

  {% include "ratings/_review_card.html" %}

  <script id="share-channels-data" type="application/json">
  [{% for ch in share_channels %}{"pk": {{ ch.pk }}, "name": "{{ ch.name|escapejs }}"}{% if not forloop.last %}, {% endif %}{% endfor %}]
  </script>
  <script src="{% static 'share-sheet.js' %}" defer></script>
  <script src="{% static 'review.js' %}" defer></script>
  <script src="{% static 'tags.js' %}" defer></script>
</body>
</html>
