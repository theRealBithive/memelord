{% for entry in entries %}
<div class="log-row log-{{ entry.level|lower }}">
  <span class="log-ts">{{ entry.timestamp|date:"H:i:s" }}</span>
  <span class="log-src">{{ entry.source }}</span>
  <span class="log-msg">{{ entry.message }}</span>
</div>
{% endfor %}
<div id="log-poll"
     hx-get="{% url 'log_entries' %}?since={{ next_since }}"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     hx-on::after-request="var c=document.getElementById('log-body');if(c)c.scrollTop=c.scrollHeight;">
</div>
