<div id="log-poll"
     hx-get="{% url 'log_entries' %}?since={{ next_since }}{% if active_source and active_source != 'all' %}&source={{ active_source }}{% endif %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
</div>
{% for entry in entries %}
<div class="log-row log-{{ entry.level|lower }}">
  <span class="log-ts">{{ entry.timestamp|date:"H:i:s" }}</span>
  <span class="log-src">{{ entry.source }}</span>
  <span class="log-msg">{{ entry.message }}</span>
</div>
{% endfor %}
