# Janulon: sources to scrape when running with --source all
# Add board/blog/topic names; leave empty or omit section to skip that source.

[4chan]
boards = ["wg", "tg"]

[tumblr]
blogs = []

[imgur]
topics = ["funny", "warhammer40k", "architecture"]

# Mastodon: for "post" command (post random corpus image).
# Create an app and get access_token from your instance (Settings → Development).
[mastodon]
base_url = "https://mastodon.social/"
# access_token can be set here or via env MASTODON_ACCESS_TOKEN
access_token = " REDACTED "

# Schedule: for "schedule" command (run scrape/post/cleanup on intervals).
# Values are in hours; fractional allowed (e.g. post_every_hours = 0.5 for 30 min).
[schedule]
scrape_every_hours = 24
post_every_hours = 1
cleanup_every_hours = 24
