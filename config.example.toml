# Memelord scraper config.
#
# Copy this file to data/config.toml (Docker) or ./config.toml (local dev) and
# fill in your sources. Every section is optional: omit it, or leave its list
# empty, to skip that source. Sources can also be added, toggled and deleted
# on the Config page in the UI, which can import this file.
#
# config.toml is gitignored in data/ — keep real access tokens out of version
# control.

[4chan]
boards = ["wg", "tg", "b", "gif"]
# Optional safety valve: cap the number of threads fetched per board and run.
# max_threads = 50

[tumblr]
blogs = []

[imgur]
topics = ["funny", "warhammer40k", "architecture"]

# Pixelfed and Mastodon both target accounts as @user@instance handles.
# access_token is only needed when the instance does not serve its public
# API anonymously.
[pixelfed]
accounts = []
# access_token = ""

[mastodon]
accounts = []
# access_token = ""

# Visibility cutoff for the review queues, 1-6 (1 = show everything, 6 = only
# the top bucket). The taste model's predicted score is bucketed against this
# value and anything below is hidden from the matching queue — without being
# moved or deleted, so lowering the value makes images reappear immediately.
# Also adjustable live on the Config page.
[vision]
sfw_threshold = 1
nsfw_threshold = 1
