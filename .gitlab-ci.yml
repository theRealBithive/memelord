stages:
  - test
  - build

test:
  stage: test
  # uv's own image ships Python 3.14 + uv; `uv sync --locked` installs exactly
  # what uv.lock pins (dev group included), so CI tests the same versions as
  # the Docker image and local development.
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_LINK_MODE: copy
  before_script:
    - uv sync --locked
  script:
    - uv run pytest -v
  cache:
    key: "${CI_COMMIT_REF_SLUG}-uv"
    paths:
      - .cache/uv/
  interruptible: true

docker:
  stage: build
  # NOTE: kaniko was archived upstream in 2025; v1.23.2 is its final release.
  # It still works for this Dockerfile (no BuildKit-only syntax is used), but
  # the long-term replacement is buildah or a Docker-in-Docker buildx job.
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    # 1. Create auth config for 'registry.exkulpa.de' using your public credentials
    - |
      echo "{\"auths\":{\"registry.exkulpa.de\":{\"auth\":\"$(printf "%s:%s" "${PUBLIC_REGISTRY_USER}" "${PUBLIC_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" \
        > /kaniko/.docker/config.json

    # 2. Build and push; cache layers in registry so deps/Playwright reuse on code-only changes.
    #    --reproducible avoids timestamp differences so same layers get the same cache key.
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "registry.exkulpa.de/maximilian/janulon-registry:${CI_COMMIT_SHORT_SHA}"
      --destination "registry.exkulpa.de/maximilian/janulon-registry:latest"
      --build-arg "APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      --cache=true
      --cache-repo "registry.exkulpa.de/maximilian/janulon-registry/cache"
      --reproducible
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  interruptible: true
